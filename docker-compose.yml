services:
  postgres:
    image: postgres:16-alpine
    container_name: aatm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aatm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aatm_password}
      POSTGRES_DB: ${POSTGRES_DB:-aatm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aatm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aatm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  aatm_pgdata:
