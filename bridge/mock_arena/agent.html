<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Planted FAKE credentials: tests assert these never leave the page (logs, DB, replies). -->
<meta name="csrf-token" content="MOCK-PLANTED-CSRF-9d41c2">
<title>Mock Arena Agent (local test page)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid #334155; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  #log { min-height: 160px; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin-block: 12px; }
  .msg { padding: 6px; margin-block: 4px; border-radius: 6px; white-space: pre-wrap; }
  .user { background: #1e293b; }
  .prose { background: #064e3b; }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea, .composer [contenteditable] { flex: 1; min-height: 60px; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 6px; }
  button { padding: 6px 12px; border-radius: 8px; }
  .banner { background: #7c2d12; padding: 8px; border-radius: 6px; margin-block: 8px; }
  .widget { border: 1px solid #6366f1; border-radius: 8px; padding: 8px; margin-block: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>Mock Arena Agent</strong>
  <button id="new" type="button" aria-label="New chat">New</button>
  <span id="status-line" style="margin-inline-start:auto;font-size:12px;opacity:.7">ready</span>
</header>
<main>
  <p>Local stand-in for the Arena Agent page. It is NOT Arena and never contacts the internet.</p>
  <div id="banners"></div>
  <div id="log"></div>
  <div id="widget" class="widget" hidden>
    <span>Was this task successful?</span>
    <button type="button" id="yes">Yes</button>
    <button type="button" id="no">No</button>
    <button type="button" id="kw">Keep working</button>
  </div>
  <div class="composer" id="composer-box">
    <div id="composer-slot"></div>
    <button type="button" id="send" aria-label="Send message"><svg width="12" height="12"><path d="M0 0L12 6L0 12z" fill="currentColor"/></svg></button>
    <button type="button" id="stop" aria-label="Stop generating" hidden>&#9632;</button>
  </div>
</main>
<script>
(function () {
  // Planted FAKE secrets (cookie + storage). A compliant userscript never reads them.
  document.cookie = "arena_session=MOCK-PLANTED-COOKIE-5be7aa; path=/";
  try { window.localStorage.setItem("auth_token", "MOCK-PLANTED-STORAGE-1c08ef"); } catch (e) {}

  var params = new URLSearchParams(location.search);
  function num(name, dflt) { var v = parseInt(params.get(name) || "", 10); return isNaN(v) ? dflt : v; }
  var genMs = num("gen_ms", 600);
  var kwRounds = num("kw_rounds", 0);          // how many times "Keep working" appears per task
  var variant = params.get("variant") || "";   // human_check | human_check_after_send | login | disconnected | recover
  var composerKind = params.get("composer") || "textarea";  // textarea | contenteditable
  var finalReport = params.get("report") || "Implementation summary: mock work done.\nModified files: feature.py\nTests: 1 passed";
  var stats = { submits: 0, kw_clicks: 0, new_sessions: 0, generations: 0, submits_while_generating: 0,
                manager_prompts: [] };
  window.__mockArena = stats;
  // Test hook: the next final reply (the agent's report) changes between review rounds.
  stats.setReport = function (text) { finalReport = String(text); };

  // ---------------------------------------------------------------- R7: answering as the manager
  // A prompt that carries an [AATM-MANAGER:<KIND>] marker gets a manager answer instead of a report:
  // CONTEXT -> short ack, CHAT -> Arabic prose, STATUS -> echoes the real state AATM sent, PLAN -> a plan
  // JSON block, REVIEW -> a verdict JSON block. The "JSON only" retry repeats the last JSON kind.
  // mgr_invalid=N (or setManager({invalid: N})) makes the next N JSON answers invalid prose.
  // mgr_reviews=request_changes,approve sets the verdict sequence (default: approve).
  var manager = {
    invalid: num("mgr_invalid", 0),
    reviews: (params.get("mgr_reviews") || "").split(",").filter(Boolean),
    chat: "مرحبًا، أنا المدير. الفريق جاهز، وسأوزّع العمل حسب تخصص كل موظف.",
    plan: {
      summary_ar: "خطة من مهمتين: الواجهة الخلفية ثم اختبارها.",
      tasks: [
        { title: "Add answer()", assignee: "worker-1", description: "Create answer() returning 42 with a pytest test.",
          acceptance_criteria: ["answer() returns 42", "tests/test_answer.py covers it"], depends_on: [] },
        { title: "Document answer()", assignee: "worker-2", description: "Document answer() in README.md.",
          acceptance_criteria: ["README.md mentions answer()"], depends_on: [0] }
      ]
    },
    lastJsonKind: null
  };
  stats.setManager = function (cfg) { Object.keys(cfg || {}).forEach(function (k) { manager[k] = cfg[k]; }); };

  function fenced(obj) { return "Here is the result.\n```json\n" + JSON.stringify(obj, null, 2) + "\n```"; }
  function jsonAnswer(kind) {
    manager.lastJsonKind = kind;
    if (manager.invalid > 0) {
      manager.invalid -= 1;
      return kind === "PLAN" ? "Sure! I would split this into a backend task and a docs task." : "Looks fine to me overall.";
    }
    if (kind === "PLAN") return fenced(manager.plan);
    var verdict = manager.reviews.length ? manager.reviews.shift() : "approve";
    if (verdict === "request_changes") {
      return fenced({ verdict: "request_changes", summary_ar: "ينقص اختبار للدالة.", comments: ["Add tests/test_answer.py with a test for answer()."] });
    }
    return fenced({ verdict: "approve", summary_ar: "التغييرات تطابق معايير القبول.", comments: [] });
  }
  function managerReply(text) {
    var m = /\[AATM-MANAGER:([A-Z]+)\]/.exec(text);
    var retry = text.indexOf("Reply again with only the JSON block, no other text.") === 0;
    if (!m && !retry) return null;
    var kind = m ? m[1] : "RETRY";
    stats.manager_prompts.push({ kind: kind, chars: text.length });
    if (retry) return jsonAnswer(manager.lastJsonKind || "PLAN");
    if (kind === "CONTEXT") return "جاهز.";
    if (kind === "CHAT") return manager.chat;
    if (kind === "STATUS") {
      var start = text.indexOf("## Current state");
      var end = text.indexOf("Answer in Arabic");
      return "الوضع الآن حسب بيانات AATM:\n" + (start >= 0 ? text.slice(start, end > start ? end : undefined).trim() : "(لا بيانات)");
    }
    if (kind === "PLAN" || kind === "REVIEW") return jsonAnswer(kind);
    return "تم.";
  }
  var nextReply = null;

  var log = document.getElementById("log");
  var widget = document.getElementById("widget");
  var sendBtn = document.getElementById("send");
  var stopBtn = document.getElementById("stop");
  var box = document.getElementById("composer-box");
  var statusLine = document.getElementById("status-line");
  var banners = document.getElementById("banners");
  var roundsLeft = 0;
  var genTimer = null;
  var draft = "";   // React-style controlled state: only updated through input events

  function render() {
    var slot = document.getElementById("composer-slot");
    slot.innerHTML = "";
    var el;
    if (composerKind === "contenteditable") {
      el = document.createElement("div");
      el.setAttribute("contenteditable", "true");
      el.setAttribute("role", "textbox");
      el.textContent = draft;
      el.addEventListener("input", function () { draft = el.textContent; sync(); });
    } else {
      el = document.createElement("textarea");
      el.placeholder = "Ask the agent";
      el.value = draft;
      el.addEventListener("input", function () { draft = el.value; sync(); });
      // A controlled input: assigning .value without an input event is reverted on the next render.
    }
    el.id = "composer";
    el.style.width = "560px";
    el.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); submit(); } });
    slot.appendChild(el);
    sync();
  }
  function composer() { return document.getElementById("composer"); }
  function sync() { sendBtn.disabled = !draft.trim(); }

  function add(cls, text, role) {
    var div = document.createElement("div");
    div.className = "msg " + cls;
    if (role) div.setAttribute("data-message-author-role", role);
    div.textContent = text;
    log.appendChild(div);
    return div;
  }

  function banner(text, attrs, cls) {
    var b = document.createElement("div");
    b.className = cls || "banner";
    Object.keys(attrs || {}).forEach(function (k) { b.setAttribute(k, attrs[k]); });
    b.textContent = text;
    banners.appendChild(b);
    return b;
  }

  function showHumanCheck() {
    banner("Please verify you are human to continue.", { "data-aatm-human-check": "true" }, "banner challenge-captcha-box");
  }

  function generate(text) {
    stats.generations += 1;
    stopBtn.hidden = false;
    sendBtn.hidden = true;
    statusLine.textContent = "generating";
    var bubble = add("prose", "", "assistant");
    bubble.textContent = "Working on it...";
    genTimer = setTimeout(function () {
      stopBtn.hidden = true;
      sendBtn.hidden = false;
      statusLine.textContent = "done";
      if (roundsLeft > 0) {
        roundsLeft -= 1;
        bubble.textContent = "Partial progress: " + text.slice(0, 40);
        widget.hidden = false;      // "Was this task successful?" + Keep working
        box.hidden = true;          // the widget replaces the composer, like Arena
      } else {
        bubble.textContent = nextReply !== null ? nextReply : finalReport;
      }
    }, genMs);
  }

  function submit() {
    var text = draft;
    if (!text.trim()) return;
    stats.submits += 1;
    if (!stopBtn.hidden) stats.submits_while_generating += 1;   // must stay 0: one prompt in flight
    nextReply = managerReply(text);
    draft = "";
    render();
    add("user", text, "user");
    if (variant === "human_check_after_send") { showHumanCheck(); return; }
    roundsLeft = kwRounds;
    generate(text);
  }

  sendBtn.addEventListener("click", submit);
  stopBtn.addEventListener("click", function () { clearTimeout(genTimer); stopBtn.hidden = true; sendBtn.hidden = false; });
  document.getElementById("kw").addEventListener("click", function () {
    stats.kw_clicks += 1;
    widget.hidden = true;
    box.hidden = false;
    generate("continuing");
  });
  document.getElementById("yes").addEventListener("click", function () { widget.hidden = true; box.hidden = false; });
  document.getElementById("no").addEventListener("click", function () { widget.hidden = true; box.hidden = false; });
  document.getElementById("new").addEventListener("click", function () {
    stats.new_sessions += 1;
    clearTimeout(genTimer);
    log.innerHTML = "";
    widget.hidden = true;
    box.hidden = false;
    stopBtn.hidden = true;
    sendBtn.hidden = false;
    draft = "";
    // Re-render a fresh composer a moment later, like a SPA route change.
    var slot = document.getElementById("composer-slot");
    slot.innerHTML = "";
    setTimeout(render, 300);
  });

  render();
  if (variant === "human_check") showHumanCheck();
  if (variant === "login") {
    box.hidden = true;
    banner("Sign in to continue to Arena.", {}, "banner login-wall");
  }
  if (variant === "disconnected" || variant === "recover") {
    composer().disabled = true;
    var b = banner("Connection lost. Reconnecting...", { "data-aatm-offline": "true" });
    if (variant === "recover") {
      setTimeout(function () { b.remove(); composer().disabled = false; }, num("recover_ms", 1500));
    }
  }
})();
</script>
</body>
</html>
