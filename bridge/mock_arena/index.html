<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Planted FAKE credentials: tests assert these never leave the page (logs, DB, answers). -->
<meta name="csrf-token" content="MOCK-PLANTED-CSRF-9d41c2">
<title>Mock Arena (local test page)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  #log { min-height: 200px; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin-block: 12px; }
  [data-role] { padding: 6px; margin-block: 4px; border-radius: 6px; white-space: pre-wrap; }
  [data-role="user"] { background: #1e293b; }
  [data-role="assistant"] { background: #064e3b; }
  textarea { width: 100%; min-height: 80px; box-sizing: border-box; }
  .banner { background: #7c2d12; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Mock Arena</h1>
  <p>Local stand-in for the Arena chat page. It is NOT Arena and never contacts the internet.</p>
  <div id="log" data-generating="false"></div>
  <form id="composer">
    <textarea id="prompt" aria-label="Message" placeholder="Message"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</main>
<script>
(function () {
  // Planted FAKE secrets (cookie + storage). A compliant userscript never reads them.
  document.cookie = "arena_session=MOCK-PLANTED-COOKIE-5be7aa; path=/";
  try { window.localStorage.setItem("auth_token", "MOCK-PLANTED-STORAGE-1c08ef"); } catch (e) {}

  var params = new URLSearchParams(location.search);
  var replies = [];
  try {
    var raw = params.get("replies");
    if (raw) {
      var b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      replies = JSON.parse(decodeURIComponent(escape(atob(b64))));
    }
  } catch (e) { replies = []; }
  var delayMs = parseInt(params.get("delay_ms") || "300", 10);
  var checkAfter = parseInt(params.get("human_check_after") || "-1", 10);
  var sent = 0;
  var log = document.getElementById("log");

  function add(role, text) {
    var div = document.createElement("div");
    div.setAttribute("data-role", role);
    div.textContent = text;
    log.appendChild(div);
    return div;
  }

  function showHumanCheck() {
    var box = document.createElement("div");
    box.className = "banner";
    box.setAttribute("data-aatm-human-check", "true");
    box.textContent = "Please verify you are human to continue.";
    document.querySelector("main").prepend(box);
  }

  // Page states seen on the real Arena Agent page, switched on by URL parameters.
  var extras = [];
  function extra(html) {
    var box = document.createElement("div");
    box.innerHTML = html;
    document.querySelector("main").appendChild(box);
    extras.push(box);
  }
  var feedback = '<div data-feedback-panel><p>Was this task successful?</p><button type="button">Yes</button><button type="button">No</button>' +
                 '<button type="button" aria-label="Close" data-close-feedback>×</button></div>';
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-close-feedback]")) return;
    var panel = ev.target.closest("[data-feedback-panel]");
    if (panel) panel.remove();
  });
  if (params.get("feedback")) extra(feedback);
  if (params.get("tool_limit")) {
    extra('<p>The agent reached the tool-call limit for this turn. Send a message to continue where it left off.</p>' +
          '<button type="button">Keep working</button>' + feedback);
  }
  if (params.get("rate_text")) {
    extra('<aside><a href="#">Fix rate limit handling</a></aside><div class="tool-output">429: rate limit exceeded in test fixture</div>' +
          '<pre>too many requests: try again</pre>');
  }
  if (params.get("rate_notice")) extra('<div role="alert">Rate limit reached. Try again in 5 minutes.</div>');
  if (params.get("rate_inline")) extra('<div><span>You have hit the rate limit.</span></div>');
  if (params.get("terms_link")) extra('<footer><a href="#">Terms of Service</a> <a href="#">Terms of Use</a></footer>');
  if (params.get("terms_dialog")) extra('<div role="dialog"><p>Please accept the Terms of Service.</p><button type="button">Accept</button></div>');
  if (params.get("captcha")) showHumanCheck();
  var form = document.getElementById("composer");
  function formExtra(html) {
    var box = document.createElement("span");
    box.innerHTML = html;
    form.appendChild(box);
  }
  window.__mergeClicks = 0;
  window.__createClicks = 0;
  document.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-merge]")) window.__mergeClicks += 1;
    if (ev.target.closest("[data-create-pr]")) window.__createClicks += 1;
  });
  if (params.get("diff")) formExtra('<button type="button">+91</button>');
  if (params.get("create_pr")) formExtra('<button type="button" data-create-pr>Create PR</button>');
  if (params.get("merge_pr")) formExtra('<button type="button" data-merge>Merge PR</button>');
  if (params.get("no_send")) document.getElementById("send").remove();
  if (params.get("reply")) add("assistant", params.get("reply"));
  if (params.get("suggestions")) {
    window.__chipClicks = 0;
    extra('<div role="radiogroup">' +
          '<button type="button" role="radio" data-chip><span data-role="assistant">خطة الموجات 2-4</span></button>' +
          '<button type="button" role="radio" data-chip>Handle the rate limit: try again</button>' +
          '<button type="button" role="radio" data-chip aria-label="Send this option">مراجعة</button>' +
          '<button type="button">Skip</button>' +
          '<textarea id="revise" placeholder="Revise options or write your own…"></textarea></div>');
    document.addEventListener("click", function (ev) {
      if (ev.target.closest("[data-chip]")) window.__chipClicks += 1;
    });
  }

  document.getElementById("composer").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = document.getElementById("prompt");
    var text = input.value;
    if (!text) return;
    input.value = "";
    extras.splice(0).forEach(function (box) { box.remove(); });
    add("user", text);
    sent += 1;
    if (checkAfter >= 0 && sent > checkAfter) { showHumanCheck(); return; }
    log.setAttribute("data-generating", "true");
    var reply = replies.length ? replies[Math.min(sent - 1, replies.length - 1)] : ("Mock answer #" + sent);
    var bubble = add("assistant", "");
    var half = Math.floor(reply.length / 2);
    // Stream in two halves so a userscript must wait for the *complete* answer.
    setTimeout(function () { bubble.textContent = reply.slice(0, half); }, Math.floor(delayMs / 2));
    setTimeout(function () { bubble.textContent = reply; log.setAttribute("data-generating", "false"); }, delayMs);
  });
})();
</script>
</body>
</html>
