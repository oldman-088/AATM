services:
  postgres:
    image: postgres:16-alpine
    container_name: aatm-postgres
    environment:
      POSTGRES_USER: aatm
      POSTGRES_PASSWORD: aatm_password
      POSTGRES_DB: aatm
    ports:
      - "5432:5432"
    volumes:
      - aatm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aatm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aatm_pgdata:
