name: AATM Continuous Integration & Verification

on:
  push:
    branches:
      - main
      - develop
      - "arena/**"
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Backend, Bridge, Secret Scan & Frontend Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies into .venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run database migrations (Alembic)
        working-directory: backend
        run: ../.venv/bin/alembic upgrade head

      - name: Run Ruff linter (Backend & Bridge)
        run: |
          .venv/bin/ruff check backend
          .venv/bin/ruff check --config backend/pyproject.toml bridge

      - name: Run Backend & E2E Pytest suite
        working-directory: backend
        run: ../.venv/bin/pytest -v

      - name: Run Arena Local Bridge Pytest suite
        run: .venv/bin/pytest -v bridge/tests/test_bridge.py

      - name: Run Static Secret & Forbidden Artifact Scanner
        working-directory: backend
        run: ../.venv/bin/python -m app.qa.engine --repo-root "$GITHUB_WORKSPACE"

      - name: Run Frontend TypeScript, Vitest & Vite Production Build
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build

      - name: Run Unified Ubuntu Verification Script
        run: bash scripts/ubuntu/verify.sh
